<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Lista actualizada de los insumos que necesita la colecta.">
  <title>Lista de la colecta</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor">
    <header class="cabecera">
      <div class="marca">
        <img class="logo" src="logo.png" alt="" width="48" height="34">
        <h1 id="titulo">Lista de la colecta</h1>
      </div>
      <p id="mensaje" class="mensaje" hidden></p>
      <p id="super" class="super" hidden></p>
      <div class="acciones">
        <p id="actualizado" class="actualizado" hidden></p>
        <button id="btn-actualizar" class="btn" type="button"><span id="btn-texto">Actualizar</span></button>
      </div>
    </header>

    <p id="demo" class="aviso aviso--info" hidden>Modo de prueba: estás viendo datos de ejemplo.</p>
    <p id="aviso" class="aviso" role="status" hidden></p>

    <section id="global" class="global" aria-labelledby="global-texto" hidden>
      <div class="global-fila">
        <p id="global-texto" class="global-texto"></p>
        <p id="global-sub" class="global-sub"></p>
      </div>
      <div id="global-barra"></div>
    </section>

    <nav id="indice" class="indice" aria-label="Categorías" hidden></nav>

    <main id="lista" class="lista" aria-busy="true">
      <p class="cargando">Cargando la lista…</p>
    </main>

    <footer class="pie">
      <p id="contacto" hidden></p>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
